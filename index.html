<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="styles/style.css" rel="stylesheet">
</head>
<body class="page">
    <div class="page__container">
        <form class="search-task-form">
            <input class="search-task-input" type="text" placeholder="Search task" />
            <button class="open-modal-btn" type="button">+</button>
        </form>
        <div class="task">
            <div class="task-item">
                <div class="task-item-left">
                    <span class="task-text" contenteditable="false">To study React fundamentals</span>
                </div>
                <div class="task-item-right">
                    <input class="task-checkbox" type="checkbox" />
                    <button class="del-btn" title="Delete">&#128465;</button>
                </div>
            </div>
        </div>
    </div> 
    <div class="modal" style="display: none;">
        <div class="modal-task">
            <form class="modal-task-form">
                <label class="modal-task-label" for="modal-task-input">Новая задача</label>
                <input id="modal-task-input" class="modal-task-input" required type="text">
                <div class="modal-task-btns">
                    <button class="modal-task-cancel" type="button">Отмена</button>
                    <button class="modal-task-add" type="submit">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="main.js"></script>

</html>
