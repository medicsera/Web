<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="styles/style.css" rel="stylesheet">
</head>
<body class="page">
    <div class="page__container">
        <form class="add-task-form">
            <input class="add-task-input" type="text" placeholder="Add a new task" />
            <button class="add-task-form-btn" type="submit">+</button>
        </form>
        <div class="task">
            <div class="task-item">
                <div class="task-item-left">
                    <span class="task-text" contenteditable="false">To study React fundamentals</span>
                </div>
                <div class="task-item-right">
                    <input class="task-checkbox" type="checkbox" />
                    <button class="task-btn" title="Delete">&#128465;</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="main.js"></script>

</html>
