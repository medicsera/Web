<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>
    
    <header>
        <nav class="nav">
            <div class="nav-name">
                <h1>MedicSera</h1>
            </div>
            <div class="nav-menu">
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#portfolio">Portfolio</a>
                <a href="#contacts">Contacts</a>
            </div>
        </nav>
    </header>

    <main>
        <div id="about"></div>
    </main>

    <footer>

    </footer>

    <script>
        const starsWrapper = document.querySelector("main");
        const stars = new Array(200).fill(0).map(() => {
        const star = document.createElement("div");
        star.className = "stars"
        starsWrapper.append(star);

        return {
            star,
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 2
            };
        });

        function update() {
            stars.forEach((star) => {
                star.x += star.r;
                if (star.x > window.innerWidth) {
                    star.x = 0;
                }

                star.star.style.transform = `translate(${star.x}px, ${star.y}px) scale(${star.r})`;
                star.star.style.opacity = `${star.r / 2}`;
            });
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    </script>
</body>
</html>
